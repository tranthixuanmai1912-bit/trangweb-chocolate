<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chocolate</title>
	  <style>
        body {
            background-color: #e6f2ff; /* Đổi nền toàn trang thành màu xanh dương nhạt */
        }
        h1 {
            color: #ff4500; /* Đổi chữ tiêu đề thành màu đỏ cam */
        }
        p {
            color: #333333; /* Đổi chữ các dòng văn bản thành màu xám đậm cho dễ đọc */
        }
        div {
            background-color: white; /* Tạo một khung nền màu trắng bao quanh nội dung bên trong */
            padding: 20px; /* Tạo khoảng cách cho chữ không bị dính sát viền khung */
            border-radius: 8px; /* Bo tròn nhẹ 4 góc của khung trắng */
        }
    </style>
</head>
<body>
    <div>
        <h1>Chocolate</h1>
        <p>Hello</p>
        <hr>
        <p>Bye </p>
    </div>
    <p> Trang này được lập bởi<em> nhóm 3</em> </p>
</body>
</html>
